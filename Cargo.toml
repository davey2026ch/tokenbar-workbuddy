[package]
name = "tokenbar"
version = "1.6.0"
edition = "2021"
description = "Tokenbar - floating token metrics bar for WorkBuddy"
authors = ["Tokenbar"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.37"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
raw-window-handle = "0.6"
# 自动更新用：只需要一个能跟系统证书走 HTTPS 的最小客户端（Windows=schannel，macOS=Security）
ureq = { version = "2", default-features = false, features = ["native-tls", "gzip"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Security", "Win32_System_LibraryLoader", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi"] }

[build-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
